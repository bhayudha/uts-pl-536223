services:
  db:
    image: mysql:8.0
    container_name: uts_pl_db
    restart: always
    environment:
      MYSQL_DATABASE: uts_buku
      MYSQL_USER: user_buku
      MYSQL_PASSWORD: password123
      MYSQL_ROOT_PASSWORD: rootpassword123
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - uts-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uts_pl_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Buku API"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "base64:u/X6v/3Gk5J8W2y23N1Q3P94X9v/3Gk5J8W2y23N1Q3="
      LOG_CHANNEL: stdout
      LOG_LEVEL: debug
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: uts_buku
      DB_USERNAME: user_buku
      DB_PASSWORD: password123
    depends_on:
      - db
    networks:
      - uts-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uts_pl_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - uts-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: uts_pl_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - uts-network

  grafana:
    image: grafana/grafana:10.4.1
    container_name: uts_pl_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - uts-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: uts_pl_cadvisor
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - uts-network

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: uts_pl_node_exporter
    restart: always
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
    networks:
      - uts-network

networks:
  uts-network:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
